name: Apply Green HTML PR Fix

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.event.pull_request.head.ref == 'agent/fix-green-html'
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Correct malformed HTML
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          html = html.replace('\n```\n', '\n')

          broken_visual = '''      <div class="visualCard">
        <img
          class="mediaImg proofImg"
          src="/assets/Wind-Solar-Wave
          alt="Wind, solar, and wave renewable inputs flowing into hydrogen storage and a Green Energy Verification dashboard."
          onerror="this.style.display='none';document.getElementById('windFallback').hidden=false;"
        />
      </div>

      <div class="systemDiagram" id="windFallback" hidden>'''

          corrected_visual = '''      <div class="systemDiagram" aria-label="Wind, solar, and wave renewable inputs connected to hydrogen storage and verification reporting.">'''

          if broken_visual not in html:
              raise SystemExit('Malformed pilot visual block was not found.')
          html = html.replace(broken_visual, corrected_visual, 1)

          asset_note = '''      <p class="assetNote">Asset-ready frame: when the dedicated moving visual is available, add <strong>/assets/Wind-Solar-Wave</strong>, <strong>.mp4</strong>, or <strong>.webp</strong> and replace the temporary verification-flow visual above.</p>
'''
          if asset_note not in html:
              raise SystemExit('Internal asset note was not found.')
          html = html.replace(asset_note, '', 1)

          path.write_text(html, encoding='utf-8')
          PY

      - name: Validate corrected markup
        run: |
          python3 - <<'PY'
          from pathlib import Path

          html = Path('index.html').read_text(encoding='utf-8')
          forbidden = [
              '```',
              'src="/assets/Wind-Solar-Wave\n',
              'Asset-ready frame:',
          ]
          for value in forbidden:
              if value in html:
                  raise SystemExit(f'Validation failed: found {value!r}')

          required = [
              '<nav class="navLinks" aria-label="Primary navigation">',
              '<div class="systemDiagram" aria-label="Wind, solar, and wave renewable inputs connected to hydrogen storage and verification reporting.">',
              '</html>',
          ]
          for value in required:
              if value not in html:
                  raise SystemExit(f'Validation failed: missing {value!r}')

          print('HTML fix validation passed.')
          PY

      - name: Commit corrected HTML to PR branch
        run: |
          rm -f .github/green-html-fix.patch
          rm -f .github/workflows/apply-green-html-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github
          git commit -m "Fix malformed HTML and pilot visual markup"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
